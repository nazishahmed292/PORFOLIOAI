# Start everything with:  docker compose up --build
# Works with zero configuration. Copy .env.example to .env to override any value.
name: portfolioai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolioai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolioai}
      POSTGRES_DB: ${POSTGRES_DB:-portfolioai}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portfolioai}:${POSTGRES_PASSWORD:-portfolioai}@db:5432/${POSTGRES_DB:-portfolioai}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development-only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      VECTOR_STORE: ${VECTOR_STORE:-pgvector}
      VECTOR_DB_URL: ${VECTOR_DB_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
