server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Document uploads (PDF/DOCX) go through this proxy; keep above the app's own limit.
    client_max_body_size 12m;

    # API requests are forwarded to the backend container (same origin, so no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming chat responses must not be buffered; LLM calls can be slow.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html so React Router can handle them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
